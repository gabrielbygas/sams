[project]
name = "sams"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "mysqlclient>=2.3.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
